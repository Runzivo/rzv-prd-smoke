name: prd smoke

# A manual docker check on a Runzivo microVM in production (rzv-infra Part of the
# exec-02 prd proof). No secrets, no checkout, no concurrency group: several runs
# may be dispatched at once so the scheduler places them across hosts.
on:
  workflow_dispatch:
    inputs:
      label:
        description: Runner label
        required: true
        type: choice
        options:
          [
            rzv-ubuntu-24.04-x64-2vcpu-8gb,
            rzv-ubuntu-24.04-x64-4vcpu-16gb,
            rzv-ubuntu-24.04-x64-6vcpu-24gb,
          ]
        default: rzv-ubuntu-24.04-x64-4vcpu-16gb
      hold_seconds:
        description: Seconds to hold the VM after the check, so runs overlap
        required: false
        type: number
        default: 90

permissions: {}

jobs:
  docker:
    runs-on: ${{ inputs.label }}
    timeout-minutes: 40
    steps:
      - name: Docker
        run: |
          docker version
          docker run --rm busybox:1.37 sh -c 'echo container ran on $(uname -m)'
      - name: Clock before
        run: |
          cat /sys/devices/system/clocksource/clocksource0/current_clocksource /sys/devices/system/clocksource/clocksource0/available_clocksource
          date -u +%s.%N
          cat /proc/uptime
          uname -r
          dmesg 2>/dev/null | grep -iE 'clocksource|tsc|kvm-clock|timer' | tail || true
      - name: Hold
        env:
          HOLD_SECONDS: ${{ inputs.hold_seconds }}
        run: |
          for i in $(seq "${HOLD_SECONDS}"); do sleep 1; printf '%s %s\n' "$(date -u +%T)" "$(cut -d' ' -f1 /proc/uptime)"; done
      - name: Clock after
        if: always()
        run: |
          date -u +%s.%N
          cat /proc/uptime
          dmesg 2>/dev/null | grep -iE 'clocksource|tsc|kvm-clock|timer|watchdog|hung' | tail || true
