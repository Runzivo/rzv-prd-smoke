name: prd reliability smoke
# Four runs a day, 6 hours apart, one runner tier per run. The longest hold runs on the smallest tier.

on:
  schedule:
    - cron: '17 0 * * *'
    - cron: '17 6 * * *'
    - cron: '17 12 * * *'
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: Runner tier (vCPU)
        required: true
        type: choice
        options: ['2', '4', '8', '16']
        default: '2'

permissions: {}

concurrency:
  group: prd-reliability-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: ${{ fromJSON('{"2":"rzv-ubuntu-24.04-x64-2vcpu-8gb","4":"rzv-ubuntu-24.04-x64-4vcpu-16gb","8":"rzv-ubuntu-24.04-x64-8vcpu-32gb","16":"rzv-ubuntu-24.04-x64-16vcpu-64gb"}')[fromJSON('{"2":"2","4":"4","8":"8","16":"16","17 0 * * *":"2","17 6 * * *":"4","17 12 * * *":"8","17 18 * * *":"16"}')[github.event_name == 'workflow_dispatch' && format('{0}', inputs.tier) || github.event.schedule]] }}
    runs-on: ${{ fromJSON('{"2":"rzv-ubuntu-24.04-x64-2vcpu-8gb","4":"rzv-ubuntu-24.04-x64-4vcpu-16gb","8":"rzv-ubuntu-24.04-x64-8vcpu-32gb","16":"rzv-ubuntu-24.04-x64-16vcpu-64gb"}')[fromJSON('{"2":"2","4":"4","8":"8","16":"16","17 0 * * *":"2","17 6 * * *":"4","17 12 * * *":"8","17 18 * * *":"16"}')[github.event_name == 'workflow_dispatch' && format('{0}', inputs.tier) || github.event.schedule]] }}
    timeout-minutes: ${{ fromJSON('{"2":55,"4":35,"8":25,"16":20}')[fromJSON('{"2":"2","4":"4","8":"8","16":"16","17 0 * * *":"2","17 6 * * *":"4","17 12 * * *":"8","17 18 * * *":"16"}')[github.event_name == 'workflow_dispatch' && format('{0}', inputs.tier) || github.event.schedule]] }}
    env:
      TIER_VCPU: ${{ fromJSON('{"2":"2","4":"4","8":"8","16":"16","17 0 * * *":"2","17 6 * * *":"4","17 12 * * *":"8","17 18 * * *":"16"}')[github.event_name == 'workflow_dispatch' && format('{0}', inputs.tier) || github.event.schedule] }}
      LABEL: ${{ fromJSON('{"2":"rzv-ubuntu-24.04-x64-2vcpu-8gb","4":"rzv-ubuntu-24.04-x64-4vcpu-16gb","8":"rzv-ubuntu-24.04-x64-8vcpu-32gb","16":"rzv-ubuntu-24.04-x64-16vcpu-64gb"}')[fromJSON('{"2":"2","4":"4","8":"8","16":"16","17 0 * * *":"2","17 6 * * *":"4","17 12 * * *":"8","17 18 * * *":"16"}')[github.event_name == 'workflow_dispatch' && format('{0}', inputs.tier) || github.event.schedule]] }}
      HOLD_MINUTES: ${{ fromJSON('{"2":"40","4":"20","8":"10","16":"5"}')[fromJSON('{"2":"2","4":"4","8":"8","16":"16","17 0 * * *":"2","17 6 * * *":"4","17 12 * * *":"8","17 18 * * *":"16"}')[github.event_name == 'workflow_dispatch' && format('{0}', inputs.tier) || github.event.schedule]] }}
    steps:
      - name: Record start and expiry gate
        id: expiry
        shell: bash
        run: |
          start_epoch="$(date -u +%s)"
          start_utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "start_epoch=${start_epoch}" >> "$GITHUB_OUTPUT"
          echo "start_utc=${start_utc}" >> "$GITHUB_OUTPUT"
          if [ "${start_utc}" \> "2026-11-23T23:59:59Z" ]; then
            echo "expired=true" >> "$GITHUB_OUTPUT"
            echo "Campaign expired at 2026-11-24T00:00:00Z; skipping Docker and hold."
          else
            echo "expired=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Docker
        if: steps.expiry.outputs.expired != 'true'
        run: |
          docker version
          docker run --rm busybox:1.37 sh -c 'echo container ran on $(uname -m)'
      - name: Hold
        if: steps.expiry.outputs.expired != 'true'
        run: sleep "$((HOLD_MINUTES * 60))"
      - name: Write summary
        if: always()
        env:
          EXPIRED: ${{ steps.expiry.outputs.expired }}
          START_EPOCH: ${{ steps.expiry.outputs.start_epoch }}
          START_UTC: ${{ steps.expiry.outputs.start_utc }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          end_epoch="$(date -u +%s)"
          end_utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          duration_seconds="unavailable"
          if [ -n "${START_EPOCH}" ]; then
            duration_seconds="$((end_epoch - START_EPOCH))"
          fi
          result="${RESULT:-unavailable}"
          if [ "${EXPIRED}" = "true" ]; then
            result="skipped-expired"
          fi
          {
            echo "## Production reliability smoke"
            echo
            echo "- Runner label: \`${LABEL}\`"
            echo "- Hold: ${HOLD_MINUTES} minutes"
            echo "- Tier: ${TIER_VCPU} vCPU"
            echo "- First step start (UTC): ${START_UTC:-unavailable}"
            echo "- End (UTC): ${end_utc}"
            echo "- Duration: ${duration_seconds} seconds"
            echo "- Result: ${result}"
            echo "- Queue wait: derived externally; join this exact first-step start to GitHub run and job metadata."
          } >> "$GITHUB_STEP_SUMMARY"
